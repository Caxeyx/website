<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0b0c10">
  <title>CASEY — Art Director & Graphic Designer</title>
  <meta name="description" content="Portfolio of Casey — Art Director, Graphic Designer, Photographer, and Stylist. Specializing in album artwork, key visuals, stage motion, and merch.">
  <script type="module" crossorigin src="/assets/index-FbsChbFf.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/index-CqbxQNX-.css">
</head>
<body>

  <!-- macOS Apple Login / Boot Screen Overlay -->
  <div id="mac-login-screen" class="mac-login-screen">
    <div class="login-backdrop-blur"></div>
    
    <!-- Top Login Header Bar -->
    <div class="login-top-bar">
      <div class="login-top-left">
        <span> macOS Sonoma</span>
      </div>
      <div class="login-top-right">
        <span class="login-wifi-icon" title="Wi-Fi Connected">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor"><path d="M12 3C7.03 3 2.53 4.98 0 8.18l12 14.82L24 8.18C21.47 4.98 16.97 3 12 3z"/></svg>
        </span>
        <span class="login-battery-icon" title="Battery 100%">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M17 4h-3V2h-4v2H7c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2z"/></svg>
        </span>
        <span id="login-clock" class="login-clock"></span>
      </div>
    </div>

    <!-- Center Login Box -->
    <div class="login-card">
      <div class="login-avatar-wrapper">
        <img class="login-avatar" src="/assets/casey_portrait-DkUbf4Cx.png" alt="Casey Avatar" onerror="this.src='https://framerusercontent.com/images/es0axIAu0guUZSRBu6xvsteey8w.png'">
        <div class="login-avatar-ring"></div>
      </div>
      
      <h1 class="login-username">CASEY</h1>
      <p class="login-user-role">Art Director & Graphic Designer</p>

      <!-- Apple macOS Password Form Container -->
      <form id="login-form" class="login-form" onsubmit="event.preventDefault(); window.startMacBootSequence && window.startMacBootSequence();">
        
        <!-- Apple Translucent Password Input Capsule -->
        <div id="login-input-box" class="login-input-wrapper">
          <input 
            type="password" 
            id="login-password-input" 
            class="login-password-input" 
            placeholder="Enter Password" 
            autocomplete="off"
            autofocus>
          <button type="submit" class="login-submit-btn" aria-label="Unlock macOS">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="5" y1="12" x2="19" y2="12"></line>
              <polyline points="12 5 19 12 12 19"></polyline>
            </svg>
          </button>
        </div>

        <!-- Apple Boot Progress Bar (Shown during login loading sequence) -->
        <div id="boot-progress-container" class="boot-progress-container">
          <div class="boot-progress-bar">
            <div id="boot-progress-fill" class="boot-progress-fill"></div>
          </div>
          <div id="boot-status-text" class="boot-status-text">Logging in...</div>
        </div>

        <!-- Subtle macOS Touch ID Hint below input -->
        <div id="login-hints-box" class="login-hints">
          <button type="button" class="login-touchid-hint-btn" onclick="window.startMacBootSequence && window.startMacBootSequence();">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 10a2 2 0 0 0-2 2c0 1.02-.1 2.51-.26 4"/>
              <path d="M14 13.12c0 2.38-.42 5.08-.88 6.88"/>
              <path d="M17.29 21.02c.12-.6.43-2.3.43-4.02 0-3.32-2.69-6-6-6s-6 2.68-6 6c0 .76.11 1.7.31 2.47"/>
              <path d="M7.74 20.35a12.8 12.8 0 0 1-.74-3.35c0-2.76 2.24-5 5-5s5 2.24 5 5c0 1.25-.42 2.76-.92 3.96"/>
              <path d="M12 2a10 10 0 0 0-10 10c0 2.48.57 4.9 1.48 7.02"/>
              <path d="M20.52 19.02A9.95 9.95 0 0 0 22 12c0-5.52-4.48-10-10-10"/>
            </svg>
            <span>Touch ID or Press Enter to Unlock</span>
          </button>
        </div>

      </form>
    </div>

    <!-- Bottom macOS Power Buttons -->
    <div class="login-bottom-controls">
      <button class="login-power-btn" onclick="window.startMacBootSequence && window.startMacBootSequence();" title="Sleep">
        <div class="power-icon-circle">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
        </div>
        <span>Sleep</span>
      </button>
      <button class="login-power-btn" onclick="location.reload()" title="Restart System">
        <div class="power-icon-circle">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>
        </div>
        <span>Restart</span>
      </button>
      <button class="login-power-btn" onclick="window.lockMacScreen && window.lockMacScreen()" title="Shut Down">
        <div class="power-icon-circle">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18.36 6.64a9 9 0 1 1-12.73 0M12 2v10"/></svg>
        </div>
        <span>Shut Down</span>
      </button>
    </div>
  </div>

  <!-- macOS Spatial Desktop Canvas -->
  <div id="desktop-canvas">
    
    <!-- Ambient Background Looping Live Video Wallpaper -->
    <div class="wallpaper-video-wrapper">
      <video 
        class="wallpaper-video" 
        src="/assets/purple-eyes-live-wallpaper-BHdRkC4Z.mp4" 
        autoplay 
        loop 
        muted 
        playsinline>
      </video>
    </div>
    <div class="ambient-overlay"></div>

    <!-- Top macOS Menu Status Bar -->
    <header class="mac-menu-bar">
      <div class="menu-left">
        <span class="menu-logo" onclick="openNotebookWindow()"> CASEY</span>
        <span class="menu-item" onclick="openNotebookWindow()">About</span>
        <span class="menu-item" onclick="openGalleryWindow()">Gallery</span>
        <span class="menu-item" onclick="openContactWindow()">Contact</span>
        <span class="menu-item" onclick="lockMacScreen()" style="color: rgba(255,255,255,0.85); gap: 5px; display: inline-flex; align-items: center;" title="Lock Screen (Touch ID)">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 10a2 2 0 0 0-2 2c0 1.02-.1 2.51-.26 4"/><path d="M14 13.12c0 2.38-.42 5.08-.88 6.88"/><path d="M17.29 21.02c.12-.6.43-2.3.43-4.02 0-3.32-2.69-6-6-6s-6 2.68-6 6c0 .76.11 1.7.31 2.47"/><path d="M7.74 20.35a12.8 12.8 0 0 1-.74-3.35c0-2.76 2.24-5 5-5s5 2.24 5 5c0 1.25-.42 2.76-.92 3.96"/><path d="M12 2a10 10 0 0 0-10 10c0 2.48.57 4.9 1.48 7.02"/><path d="M20.52 19.02A9.95 9.95 0 0 0 22 12c0-5.52-4.48-10-10-10"/></svg>
          Lock
        </span>
      </div>
      <div class="menu-right">
        <span class="status-badge">
          <span class="status-dot"></span> Available for Projects
        </span>
        <span id="menu-clock">Thu Jul 30 17:34</span>
      </div>
    </header>

    <!-- Scattered Desktop Project Items -->
    <main id="desktop-grid" class="desktop-grid"></main>

    <!-- Window Manager Layer -->
    <div id="window-stack" class="window-container"></div>

    <!-- macOS Solid App Dock -->
    <footer id="mac-dock" class="dock-container">
      
      <!-- Adobe After Effects Easter Egg -->
      <div class="dock-item" onclick="openAdobeDialog('ae')">
        <img src="https://framerusercontent.com/images/FGXr3pqtmk0UpCXHi0IZJgC4H8.png" alt="After Effects">
        <span class="dock-tooltip">After Effects</span>
      </div>

      <!-- Adobe Photoshop Easter Egg -->
      <div class="dock-item" onclick="openAdobeDialog('ps')">
        <img src="https://framerusercontent.com/images/iDBBsIGms7v4vkBAa7EBeh9PGuM.png" alt="Photoshop">
        <span class="dock-tooltip">Photoshop</span>
      </div>

      <!-- Adobe Illustrator Easter Egg -->
      <div class="dock-item" onclick="openAdobeDialog('ai')">
        <img src="https://framerusercontent.com/images/VHJFQu7ykJIdCqTTduCtUcpcA.png" alt="Illustrator">
        <span class="dock-tooltip">Illustrator</span>
      </div>

      <!-- Warning Easter Egg -->
      <div class="dock-item" onclick="openAdobeDialog('warn')">
        <img src="https://framerusercontent.com/images/BSPnJPSH4K1WxhDJJbEfUgT7U.png" alt="Warning">
        <span class="dock-tooltip">System Warning</span>
      </div>

      <div class="dock-divider"></div>

      <!-- Kajecik / About / CV Notebook -->
      <div class="dock-item" onclick="openNotebookWindow()">
        <img src="https://framerusercontent.com/images/es0axIAu0guUZSRBu6xvsteey8w.png" alt="Kajecik Notebook">
        <span class="dock-tooltip">Kajecik (About & CV)</span>
      </div>

      <!-- Photos / Gallery Showcase -->
      <div class="dock-item" onclick="openGalleryWindow()">
        <img src="https://framerusercontent.com/images/yNLcekVy7df0d4hAoz6dZR8s.png" alt="Photos Gallery">
        <span class="dock-tooltip">Photos Gallery</span>
      </div>

      <!-- Spotify Player App -->
      <div class="dock-item app-spotify" onclick="openSpotifyWindow()">
        <svg viewBox="0 0 24 24" width="28" height="28" fill="#1ed760"><path d="M12 0C5.376 0 0 5.376 0 12s5.376 12 12 12 12-5.376 12-12S18.624 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.48-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141 4.38-1.38 9.841-.72 13.561 1.56.36.18.54.78.18 1.26zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.18-1.2-.18-1.38-.72-.18-.6.18-1.2.72-1.38 4.26-1.26 11.28-1.02 15.721 1.62.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/></svg>
        <span class="dock-tooltip">Spotify</span>
      </div>

      <!-- Instagram Link -->
      <div class="dock-item" onclick="window.open('https://www.instagram.com/caseyxlive/', '_blank')">
        <img src="https://framerusercontent.com/images/fZcO2HO3MMDvuS9IcWLgq5MyMc.png" alt="Instagram">
        <span class="dock-tooltip">Instagram (@caseyxlive)</span>
      </div>

      <!-- Email / Contact -->
      <div class="dock-item" onclick="openContactWindow()">
        <img src="https://framerusercontent.com/images/4ZZQ6ZFOyrBZ3TXhVZjMFK7zbGk.png" alt="Contact Mail">
        <span class="dock-tooltip">Contact Mail</span>
      </div>

      <!-- Bin of Ideas / Trash -->
      <div class="dock-item" onclick="openBinWindow()">
        <img src="https://framerusercontent.com/images/Hfn1FB5V1VnB099tUlAIyjV1tC4.png" alt="Trash">
        <span class="dock-tooltip">Bin of Ideas</span>
      </div>

    </footer>

  </div>

  <!-- JavaScript Scripts -->
</body>
</html>
